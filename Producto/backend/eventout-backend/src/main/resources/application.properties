spring.application.name=eventout-backend

# ============================================================
# Base de datos MySQL (eventout_db)
# La BD eventout_db se crea sola la primera vez (createDatabaseIfNotExist=true).
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/eventout_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Jackson: JSON en snake_case para coincidir con el frontend
# (es_gratuito, fecha_inicio, id_lugar, created_at, ...)
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Santiago
spring.jackson.serialization.write-dates-as-timestamps=false

# El sembrado de datos lo hace DataInitializer (CommandLineRunner) para cifrar
# las contraseñas con BCrypt. No usamos data.sql.
spring.sql.init.mode=never

# ============================================================
# JWT
# ============================================================
# Clave HS256 en Base64. Cambiar en produccion (>= 32 bytes). Override con env JWT_SECRET.
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQta2V5LWV2ZW50b3V0LTIwMjY=}
# Duracion del access token en milisegundos (24h)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Duracion del token de recuperacion de contrasena (1h)
app.jwt.reset-expiration-ms=${JWT_RESET_EXPIRATION_MS:3600000}

# ============================================================
# Frontend / CORS
# ============================================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# Correo (JavaMailSender) - recuperacion de contrasena
# Configurar via variables de entorno. Por defecto Gmail SMTP.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@eventout.cl}

# ============================================================
# OpenAPI / Swagger UI -> http://localhost:8080/swagger-ui.html
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
