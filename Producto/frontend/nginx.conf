server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida devuelve index.html para que React Router
    # maneje la navegacion en el cliente. Equivale al rewrite de vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
